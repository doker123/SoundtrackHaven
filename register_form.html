<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="css/Форма%20авторизации%20и%20регистрации/style.css">
    <link rel="icon" href="img/favicon/favicon.svg">
</head>
<body class="bodyIndex">
<header class="generalMenu">
    <a href="index.html" class="iconHome">
        SH
    </a>
    <nav>
        <a href="search_music.html">
            <div class="backgroundColourIconNav">
                <img class="iconNav" src="img/Общие_изображения/Лупа.svg" alt="find">
            </div>
        </a>
        <a href="catalog_playlist.html">
            <div class="backgroundColourIconNav">
                <img class="iconNav" src="img/Общие_изображения/Список.svg" alt="catalogPlaylist">
            </div>
        </a>
        <a href="playlist_favorite_music_user.html">
            <div class="backgroundColourIconNav">
                <img class="iconNav" src="img/Общие_изображения/Нота.svg" alt="favoriteMusic">
            </div>
        </a>
    </nav>
    <a class="userProfile" href="register_form.html">
        <img class="playerIcon" src="img/Общие_изображения/Фото_Профиля.svg" alt="icon-profile">
    </a>
</header>
<main class="contentMain">
    <div class="wrapper">
        <div class="formRegister">
            <form method="post" action="#">
                <label for="nameField"></label>
                <input type="text" id="nameField" name="nameField" placeholder="Введите имя" required>
                <label for="emailField"></label>
                <input type="email" id="emailField" name="emailField" placeholder="Введите почту" required>
                <label for="passwordField"></label>
                <input type="password" id="passwordField" name="passwordField" placeholder="Введите пароль" required>
                <label for="passwordField2"></label>
                <input type="password" id="passwordField2" name="passwordField2" placeholder="Повторите пароль" required>
                <div class="userAgreement">
                    <p class="paragraphUserAgreement">Вы согласны с пользовательским</p>
                    <a class="linkUserAgreement">соглашением</a>
                    <label for="agreeTerms"></label>
                    <input type="checkbox" name="agreeTerms" id="agreeTerms" required>
                </div>
                <div class="linkAuthorizationContainer">
                    <p>Есть аккаунт?</p>
                    <a class="linkAuthorization" href="authorization_form.html">Авторизуйся.</a>
                </div>
                <input type="submit" value="Отправить" id="submitButton" name="submitButton">
            </form>
        </div>
    </div>
</main>
</body>
</html>
