<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Форма авторизации</title>
    <link rel="stylesheet" href="css/auth/style.css">
    <link rel="icon" href="img/favicon/favicon.svg">
</head>
<body class="bodyIndex">
<header class="generalMenu">
    <a href="index.html" class="iconHome">
        SH
    </a>
    <nav>
        <a href="search_music.html">
            <div class="backgroundColourIconNav">
                <img class="iconNav" src="img/Общие_изображения/Лупа.svg" alt="find">
            </div>
        </a>
        <a href="catalog_playlist.html">
            <div class="backgroundColourIconNav">
                <img class="iconNav" src="img/Общие_изображения/Список.svg" alt="catalogPlaylist">
            </div>
        </a>
        <a href="playlist_favorite_music_user.html">
            <div class="backgroundColourIconNav">
                <img class="iconNav" src="img/Общие_изображения/Нота.svg" alt="favoriteMusic">
            </div>
        </a>
    </nav>
    <a class="userProfile" href="register_form.html">
        <img src="img/Общие_изображения/Фото_Профиля.svg" alt="icon-profile">
    </a>
</header>
<main class="contentMain">
    <div class="wrapper">
        <div class="formAuthorization">
            <form method="post" action="#">
                <input type="text" id="nameField" name="nameField" placeholder="Введите имя" aria-label="Введите имя" required>
                <input type="password" id="passwordField" name="passwordField" placeholder="Введите пароль" aria-label="Введите пароль" required>
                <div class="linkRegisterContainer">
                    <p>Нет аккаунта?</p>
                    <a class="linkRegister" href="register_form.html">Зарегистрируйся</a>
                </div>
                <button type="submit" id="submitButton" name="submitButton">Авторизоваться</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
